name: Build

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install make and Inkscape
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make inkscape

      # Ubuntu's apt package is ImageMagick 6, which has no `magick` command,
      # so install the official ImageMagick 7 AppImage from the latest GitHub
      # release instead.
      - name: Install ImageMagick 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ImageMagick/ImageMagick --pattern '*-gcc-x86_64.AppImage' --output magick
          chmod +x magick
          sudo mv magick /usr/local/bin/magick
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Tool versions
        run: |
          make --version | head -1
          node --version
          inkscape --version
          magick -version | head -1

      - name: Build
        run: make package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" NFSTR-HighResTexturePack.zip --title "$GITHUB_REF_NAME" --generate-notes
